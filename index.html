<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Penghitung Kendaraan AI Sukoharjo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #1e1e1e; 
            color: #fff; 
            margin: 0; padding: 20px;
        }
        h1 { color: #00ff88; font-size: 24px; }
        #canvas-container { 
            position: relative; display: inline-block; margin-top: 15px;
            border: 4px solid #333; background: #000; width: 640px; height: 480px;
        }
        #cctv { display: none; }
        canvas { position: absolute; left: 0; top: 0; }
    </style>
</head>
<body>

    <h1>Pemantau & Penghitung Kendaraan AI</h1>
    <h2 id="status">Memuat Model AI...</h2>

    <div id="canvas-container">
        <img id="cctv" width="640" height="480">
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const img = document.getElementById('cctv');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        
        let aiModel = null;
        const targetKelas = ['car', 'motorcycle', 'bus', 'truck'];
        const targetUrl = "https://zmcctv.sukoharjokab.go.id/zm/cgi-bin/nph-zms?mode=jpeg&monitor=15&scale=100&maxfps=25&buffer=1000&user=user&pass=user";

        function ambilGambarCCTV() {
            const freshUrl = targetUrl + "&timestamp=" + new Date().getTime();
            // AllOrigins bekerja dengan baik saat dipanggil dari domain HTTPS (seperti GitHub Pages)
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(freshUrl)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Network error.');
                })
                .then(data => {
                    if (data.contents) {
                        img.src = data.contents;
                    }
                })
                .catch(err => console.log("Mengambil frame..."));
        }

        // Jalankan pengambilan gambar berkala
        setInterval(ambilGambarCCTV, 2000);

        img.onload = function() {
            if (!aiModel) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            aiModel.detect(canvas).then(predictions => {
                let jumlahKendaraan = 0;
                predictions.forEach(prediction => {
                    if (targetKelas.includes(prediction.class)) {
                        jumlahKendaraan++;
                        ctx.strokeStyle = '#00FF88';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(...prediction.bbox);

                        ctx.fillStyle = '#00FF88';
                        ctx.font = 'bold 14px sans-serif';
                        
                        let namaKelas = prediction.class;
                        if (namaKelas === 'car') namaKelas = 'Mobil';
                        if (namaKelas === 'motorcycle') namaKelas = 'Motor';
                        if (namaKelas === 'bus') namaKelas = 'Bus';
                        if (namaKelas === 'truck') namaKelas = 'Truk';

                        ctx.fillText(`${namaKelas} (${Math.round(prediction.score * 100)}%)`, prediction.bbox[0], prediction.bbox[1] > 15 ? prediction.bbox[1] - 6 : 15);
                    }
                });
                statusText.innerText = `CCTV Sukoharjo - Kendaraan Terdeteksi: ${jumlahKendaraan}`;
            });
        };

        cocoSsd.load().then(model => {
            aiModel = model;
            statusText.innerText = "Model Siap! Menghubungkan ke CCTV...";
            ambilGambarCCTV();
        });
    </script>
</body>
</html>
